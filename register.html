<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#5b45ff">
  <!-- Apply saved theme before paint to avoid a flash -->
  <script>document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("vx_theme") || "null") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <title>Create account — ElectroMart</title>
</head>
<body>
  <header id="navbar"></header>
  <main class="auth-wrap">
    <aside class="auth-side">
      <a href="index.html" class="logo"><span class="logo-mark">⚡</span>ElectroMart</a>
      <h2>Join the <em>ElectroMart</em> crew. Unlock member-only drops.</h2>
      <img src="images/laptop-1.png" alt="" width="520" height="520" data-cdn>
      <p class="muted small">Secure phone verification with a one-time code.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-card">
        <span class="eyebrow">Create account</span>
        <h1>Let's get you set up</h1>
        <p class="muted">We'll verify your phone with a 6-digit code.</p>

        <!-- Registration form: name, phone, email, password -->
        <form class="form" id="registerForm" novalidate>
          <div class="alert" id="formAlert" hidden></div>
          <div class="field">
            <label for="name">Full name</label>
            <input class="input" id="name" name="name" autocomplete="name" placeholder="Aarav Sharma">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <div class="input-group"><span class="prefix">+91</span>
              <input class="input has-prefix" id="phone" name="phone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="9876543210"></div>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
              <button type="button" class="toggle-pw" data-toggle="password">Show</button></div>
            <span class="field-error"></span>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Send OTP &amp; register</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/smart.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/recovery.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
