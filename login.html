<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#5b45ff">
  <!-- Apply saved theme before paint to avoid a flash -->
  <script>document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("vx_theme") || "null") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <title>Log in — ElectroMart</title>
</head>
<body>
  <header id="navbar"></header>
  <main class="auth-wrap">
    <aside class="auth-side">
      <a href="index.html" class="logo"><span class="logo-mark">⚡</span>ElectroMart</a>
      <h2>Welcome back. Your <em>cart</em> missed you.</h2>
      <img src="images/headphones-1.png" alt="" width="520" height="520" data-cdn>
      <p class="muted small">Secure phone verification with a one-time code.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-card">
        <span class="eyebrow">Log in</span>
        <h1>Good to see you</h1>
        <p class="muted">Log in with your email or phone number.</p>

        <!-- Login form: email/phone + password, then OTP -->
        <form class="form" id="loginForm" novalidate>
          <div class="alert" id="formAlert" hidden></div>
          <div class="field">
            <label for="identifier">Email or phone number</label>
            <input class="input" id="identifier" name="identifier" autocomplete="username" placeholder="you@example.com or 9876543210">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
              <button type="button" class="toggle-pw" data-toggle="password">Show</button></div>
            <span class="field-error"></span>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Continue with OTP</button>
        </form>
        <p class="auth-foot">New to ElectroMart? <a href="register.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/smart.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/recovery.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
